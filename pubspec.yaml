name: nekopost_clone
description: แอปอ่านมังงะออนไลน์ (MangaDex API + PDF Support Edition)
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.1
  
  # HTTP & API
  dio: ^5.4.0
  http: ^1.1.0
  
  # Image Handling
  cached_network_image: ^3.3.0
  
  # Local Storage
  shared_preferences: ^2.2.2
  
  # PDF Support 📄
  flutter_pdfview: ^1.3.2
  path_provider: ^2.1.1
  
  # UI Components
  cupertino_icons: ^1.0.6
  
  # Utilities
  intl: ^0.18.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true